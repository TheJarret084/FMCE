name: Android Release (Auto)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;21.4.7075529"

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p building
            printf '%s' "$ANDROID_KEYSTORE_BASE64" \
              | base64 --decode > building/android.keystore
            chmod 600 building/android.keystore
            echo "Keystore restaurada."
          else
            echo "No hay keystore configurada; se usara debug."
          fi

      - name: Build Android (release)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: bash building/android-build.sh release

      - name: Verify APK signature
        shell: bash
        run: |
          APK="building/artifacts/FMCE-Android-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "No se encontro apksigner."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMCE-Android-release
          path: building/artifacts/FMCE-Android-release.apk
          if-no-files-found: error

      - name: Publish build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: building/artifacts/FMCE-Android-release.apk
          fail_on_unmatched_files: true

      - name: Remove temporary keystore
        if: always()
        run: rm -f building/android.keystore
