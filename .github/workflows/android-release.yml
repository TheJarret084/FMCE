name: Android Release (Auto)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;21.4.7075529"

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          rm -f building/android.keystore
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No hay keystore configurada: el APK saldra firmado en debug."
            exit 0
          fi
          mkdir -p building
          # tr quita espacios, saltos de linea y CR que se cuelan al pegar el secret.
          if printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' \
              | base64 --decode > building/android.keystore 2>/dev/null; then
            chmod 600 building/android.keystore
            echo "Keystore restaurada."
          else
            rm -f building/android.keystore
            echo "::warning::ANDROID_KEYSTORE_BASE64 no es base64 valido: el APK saldra firmado en debug."
          fi

      # Seguro: la llave solo se usa si abre con el alias y la contrasena y su llave privada se puede
      # leer. Si no, se borra y el build sigue firmado en debug en vez de fallar al final.
      - name: Check keystore
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [ ! -f building/android.keystore ]; then
            echo "Firma: debug (sin keystore)" >> "$GITHUB_STEP_SUMMARY"
          elif bash building/check-keystore.sh building/android.keystore; then
            echo "Firma: keystore FMCE (verificado)" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f building/android.keystore
            echo "::warning::Keystore danado o secrets incorrectos (motivo arriba): se compila firmado en debug."
            echo "Firma: debug (keystore invalido, revisa los secrets)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # El build se caia con OutOfMemoryError (lintVital + packageRelease) por el heap por defecto de Gradle.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          EOF

      - name: Build Android (release)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: bash building/android-build.sh release

      - name: Verify APK signature
        shell: bash
        run: |
          APK="building/artifacts/FMCE-Android-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "No se encontro apksigner."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      # saltamos esto por petición de github

      # - name: Upload APK as workflow artifact
      #   uses: actions/upload-artifact@v4
      #  with:
      #    name: FMCE-Android-release
      #    path: building/artifacts/FMCE-Android-release.apk
      #    if-no-files-found: error

      - name: Publish build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: building/artifacts/FMCE-Android-release.apk
          fail_on_unmatched_files: true

      - name: Remove temporary keystore
        if: always()
        run: rm -f building/android.keystore
